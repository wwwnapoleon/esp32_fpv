<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация · ЭКО-ШКОЛА</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>

<body class="login-page">
  <div class="login-container">

    <div class="logo-block">
      <h1>🌿 ЭКО-ШКОЛА</h1>
      <p class="subtitle">Регистрация ученика</p>
    </div>

    <form id="register-form" autocomplete="off">
      <div class="input-group">
        <label for="fio">ФИО</label>
        <input type="text" id="fio" placeholder="Иванов Иван Иванович" required>
      </div>

      <div class="input-group">
        <label for="class">Класс</label>
        <input type="text" id="class" placeholder="8 А" required>
      </div>

      <div class="input-group">
        <label for="color">Любимый цвет</label>
        <input type="color" id="color" value="#3fb950">
      </div>

      <button type="submit" class="btn-primary">📝 Зарегистрироваться</button>
    </form>

    <p id="register-status" class="error"></p>

    <p class="footer-hint">
      Уже зарегистрированы? <a href="login.html">Войти по QR</a>
    </p>

    <a href="index.html" class="btn-back">← На главную</a>
  </div>

  <!-- ============ СКРИПТЫ ============ -->

  <!-- 1. Библиотека Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Конфигурация (создаёт CONFIG и SB) -->
  <script src="js/config.js"></script>

  <!-- 3. Логика регистрации -->
  <script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      var fio      = document.getElementById('fio').value.trim();
      var cls      = document.getElementById('class').value.trim();
      var color    = document.getElementById('color').value;
      var statusEl = document.getElementById('register-status');

      statusEl.textContent = '⏳ Сохранение...';
      statusEl.className = 'error';

      // ---- Supabase режим ----
      if (typeof SB !== 'undefined' && SB) {
        try {
          const { data, error } = await SB
            .from('students')
            .insert([{ fio: fio, class: cls, color: color }])
            .select();

          if (error) throw error;

          console.log('✅ Сохранено в Supabase:', data);

          statusEl.textContent = '✅ Спасибо, ' + fio + '! Вы зарегистрированы.';
          statusEl.className = 'review-status success';

          setTimeout(function() {
            window.location.href = 'index.html';
          }, 2000);

        } catch (err) {
          console.error('❌ Supabase error:', err);
          statusEl.textContent = '❌ Ошибка: ' + err.message;
        }
        return;
      }

      // ---- Демо-режим (localStorage) ----
      console.warn('⚠️ Supabase не подключён — сохраняем локально');

      var student = { fio: fio, class: cls, color: color, created: new Date().toISOString() };
      var students = JSON.parse(localStorage.getItem('students') || '[]');
      students.push(student);
      localStorage.setItem('students', JSON.stringify(students));

      statusEl.textContent = '✅ Спасибо, ' + fio + '! Зарегистрированы (локально).';
      statusEl.className = 'review-status success';

      setTimeout(function() {
        window.location.href = 'index.html';
      }, 2000);
    });
  </script>
</body>
</html>
