<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База данных · ЭКО-ШКОЛА</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <!-- Шрифты (для редизайна) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Стили: сначала базовые, потом редизайн -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="database-page">

  <header class="topbar">
    <a href="project-page.html" class="btn-back">← Назад</a>
    <div class="brand">
      <span class="logo-icon">🗄️</span>
      <span class="brand-name">ЭКО-ШКОЛА</span>
    </div>
    <span id="user-role" class="role-badge"></span>
  </header>

  <main class="database-main">
    <h1>База данных «ЭКО-ШКОЛА»</h1>
    <p class="subtitle">Экологические проекты лицея №8</p>

    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 Поиск по названию...">
      <button id="refresh" class="btn">🔄 Обновить</button>
      <button id="add-row" class="btn btn-admin" style="display:none;">
        ➕ Добавить запись
      </button>
    </div>

    <div id="db-status" class="status"></div>

    <table class="data-table" id="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Название проекта</th>
          <th>Участники</th>
          <th>Дата</th>
          <th>Статус</th>
          <th class="col-admin" style="display:none;">Действия</th>
        </tr>
      </thead>
      <tbody id="data-body">
        <tr><td colspan="6" class="empty">Загрузка...</td></tr>
      </tbody>
    </table>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
</body>
</html>
