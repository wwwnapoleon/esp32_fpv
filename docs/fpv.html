<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV камера · ЭКО-ШКОЛА</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="fpv-page">

  <header class="topbar">
    <a href="dashboard.html" class="btn-back">← Назад</a>
    <div class="brand">
      <span class="logo-icon">📹</span>
      <span class="brand-name">FPV камера</span>
    </div>
    <span id="user-role" class="role-badge"></span>
  </header>

  <main class="fpv-main">
    <div class="video-container">
      <img id="stream" src="" alt="Поток с камеры" class="stream">
      <div class="video-overlay" id="status-overlay">Подключение...</div>
    </div>

    <div class="fpv-toolbar">
      <button id="connect" class="btn">🔄 Подключить</button>
      <button id="snapshot" class="btn">📸 Снимок</button>
      <span id="fps-info" class="fps-info">FPS: —</span>
    </div>

    <!-- Управление серво для админов -->
    <div class="servo-controls" id="servo-controls" style="display:none;">
      <h3>🎛️ Управление камерой</h3>
      <div class="row">
        <label>PAN</label>
        <input type="range" id="pan"  min="0" max="180" value="90">
        <span id="pan-val">90°</span>
      </div>
      <div class="row">
        <label>TILT</label>
        <input type="range" id="tilt" min="0" max="180" value="90">
        <span id="tilt-val">90°</span>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fpv.js"></script>
</body>
</html>
