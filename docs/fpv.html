<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV камера · ЭКО-ШКОЛА</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <!-- Шрифты (для редизайна) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Стили: сначала базовые, потом редизайн -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="btn-back">← Назад</a>
    <div class="brand">
      <span class="logo-icon">📹</span>
      <span>FPV камера</span>
    </div>
    <span id="user-role" class="role-badge"></span>
  </header>

  <main class="fpv-main">

    <div class="video-container">
      <img id="stream" class="stream" alt="Поток с камеры">
      <div class="video-overlay" id="status-overlay">
        Нажмите «Подключить», чтобы начать просмотр
      </div>
    </div>

    <div class="fpv-toolbar">
      <button id="connect" class="btn btn-primary">🔄 Подключить</button>
      <button id="disconnect" class="btn">⏹️ Отключить</button>
      <button id="snapshot" class="btn">📸 Снимок</button>
      <span id="fps-info" class="fps-info">FPS: —</span>
    </div>

    <!-- Управление серво (только для админов) -->
    <div class="servo-controls" id="servo-controls" style="display:none;">
      <h3>🎛️ Управление камерой</h3>
      <div class="row">
        <label>PAN</label>
        <input type="range" id="pan" min="0" max="180" value="90">
        <span id="pan-val">90°</span>
      </div>
      <div class="row">
        <label>TILT</label>
        <input type="range" id="tilt" min="0" max="180" value="90">
        <span id="tilt-val">90°</span>
      </div>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fpv.js"></script>
</body>
</html>
